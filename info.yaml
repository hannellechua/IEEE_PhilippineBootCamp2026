# Tiny Tapeout project information
project:
  title:        "Tiny Cyberdeck — Interactive VGA Logic Core"
  author:       "Hannelle Chua"
  discord:      "@hanwheee"
  description:  "Interactive VGA cyberdeck controlled by four digital inputs"
  language:     "Verilog"
  clock_hz:     25000000

  # How many tiles your design occupies
  tiles: "1x1"

  # Top-level Verilog module
  top_module: "tt_um_hannellechua_tiny_cyberdeck"

  # Verilog source files located in ./src
  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "CYBER INPUT 0"
  ui[1]: "CYBER INPUT 1"
  ui[2]: "CYBER INPUT 2"
  ui[3]: "CYBER INPUT 3"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # VGA outputs
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"

  # Bidirectional pins unused
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
